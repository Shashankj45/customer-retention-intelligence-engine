version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: customer_churn_postgres
    restart: always
    environment:
      POSTGRES_DB: customer_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema_ddl.sql:/docker-entrypoint-initdb.d/01_schema_ddl.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Customer Intelligence Streamlit Application
  app:
    build: .
    container_name: customer_churn_dashboard
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=customer_intelligence
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs

  # 3. MLflow Tracking Server
  mlflow:
    image: python:3.12-slim
    container_name: customer_churn_mlflow
    restart: always
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow psycopg2-binary &&
             mlflow server --backend-store-uri postgresql://postgres:postgrespassword@postgres:5432/customer_intelligence
                           --default-artifact-root /mlflow/artifacts
                           --host 0.0.0.0 --port 5000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

volumes:
  postgres_data:
  mlflow_artifacts:
